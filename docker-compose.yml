# Claude Code -> relay (applies the policy) -> OpenTelemetry Collector -> ClickHouse.
# The relay is the only port telemetry can enter through; the collector is internal.
name: agent-otel-starter

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      # Local demo only: lets the passwordless default user connect over the network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP: the app, the hooks and query.sh use this
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    # No host ports: everything comes in through the relay.
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  relay:
    image: python:3.13.5-alpine
    command: ["python", "-u", "/relay/relay.py"]
    environment:
      UPSTREAM: http://otel-collector:4318
      POLICY_FILE: /data/policy.json
    volumes:
      - ./relay:/relay:ro
      - relay-data:/data          # the policy survives restarts
    ports:
      - "127.0.0.1:4318:4318"     # OTLP HTTP/JSON in (Claude Code, seed script) + /policy for the app
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4318/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  clickhouse-data:
  relay-data:
